<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>语音任务四象限 - 高保真原型</title>
  <style>
    body{margin:0;font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#eef4ff;color:#0f172a}
    .wrap{max-width:1200px;margin:24px auto;padding:0 16px}
    h1{font-size:28px;margin:0 0 8px}
    p{color:#475569}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
    a.card{background:#fff;border-radius:14px;padding:14px;text-decoration:none;color:inherit;box-shadow:0 6px 20px rgba(37,99,235,.12)}
    .name{font-weight:700;margin-bottom:6px}
    .tip{font-size:13px;color:#64748b}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>语音任务四象限 App 原型</h1>
    <p>点击下方页面名称打开高清 SVG。建议浏览器中查看，支持页面内热点跳转演示。</p>
    <div class="grid">
      <a class="card" href="01_看板页.svg"><div class="name">01 看板页</div><div class="tip">四象限总览</div></a>
      <a class="card" href="02_语音新建页.svg"><div class="name">02 语音新建页</div><div class="tip">录音与兜底输入</div></a>
      <a class="card" href="03_转写确认页.svg"><div class="name">03 转写确认页</div><div class="tip">编辑并保存任务</div></a>
      <a class="card" href="04_任务详情页.svg"><div class="name">04 任务详情页</div><div class="tip">状态、进度、子任务</div></a>
      <a class="card" href="05_任务列表页.svg"><div class="name">05 任务列表页</div><div class="tip">筛选排序列表</div></a>
      <a class="card" href="06_子任务编辑页.svg"><div class="name">06 子任务编辑页</div><div class="tip">子任务状态编辑</div></a>
    </div>
  </div>
</body>
</html>
